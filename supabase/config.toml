project_id = "lexia"

[auth]
site_url = "lexia://auth/callback"
additional_redirect_urls = ["lexia://auth/callback"]

[auth.email]
enabled = true
# Sin confirmación por email durante desarrollo (el SMTP integrado del free
# tier limita a ~2 correos/hora). Activar + SMTP propio antes de producción.
enable_confirmations = false

# Por ahora la app solo usa email + contraseña (Apple y Google retirados).
[auth.external.apple]
enabled = false

[auth.external.google]
enabled = false

# Edge Functions: el gateway valida el JWT antes de invocar
[functions.generate-word]
verify_jwt = true

[functions.delete-account]
verify_jwt = true
